name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; don't cancel a deploy that's already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Physics, generator and map tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect the site files
        run: |
          mkdir -p _site
          cp -r index.html icon.svg .nojekyll css js maps _site/
      - name: Version the file links
        # Browsers keep Pages files for 10 minutes. Tagging every script and
        # style link with this commit means a reload never mixes a new page
        # with old cached scripts.
        run: |
          V="${GITHUB_SHA::8}"
          find _site/js -name '*.js' -exec sed -i -E "s#(from '[^']+\.js)'#\1?v=$V'#g" {} +
          sed -i -E "s#(src=\"js/main\.js)\"#\1?v=$V\"#; s#(href=\"css/style\.css)\"#\1?v=$V\"#" _site/index.html
          grep -c "?v=$V" _site/index.html _site/js/main.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
